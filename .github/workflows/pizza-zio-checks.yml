name: Pizza Zio checks
on:
  push:
    branches: ['codex/pizza-zio-*']
  pull_request:
    branches: ['codex/create-landing-page-for-pizza-zio-franchise']
permissions:
  contents: read
concurrency:
  group: pizza-zio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      LEAD_INTAKE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Install Redis for isolated integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends redis-server redis-tools
          redis-server --version
          redis-cli --version
      - run: npm run check
        env:
          PIZZA_ZIO_REDIS_BIN: /usr/bin/redis-server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:integration
        env:
          REDIS_SERVER_PATH: /usr/bin/redis-server
          REDIS_CLI_PATH: /usr/bin/redis-cli
      - run: npm audit --audit-level=high
